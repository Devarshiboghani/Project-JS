<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page with CRUD Operations</title>

    <!-- css link-->
    <link rel="stylesheet" href="style.css">

     <!-- bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    
    <div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="admin-box shadow-sm p-4 border rounded bg-white">
                <h2 class="text-center mb-4">Add New Product</h2>

    <form id="product-form">
        <div class="mb-3">
        <label for="title">Product Title</label>
        <input type="text" id="title" class="form-control" placeholder="Enter product name" required>
        </div>

        <div class="mb-3">
        <label for="price">Price ($)</label>
        <input type="number" id="price" class="form-control" placeholder="Enter price" required>
        </div>

        <div class="mb-3">
        <label for="image">Image URL</label>
        <input type="url" id="image" class="form-control" placeholder="image" required>
        </div>

        <div class="mb-3">
        <label class="form-label">Category</label>
        <select id="category" class="form-select" required>
            <option value="">Select a category</option>
            <option value="Convenience">Convenience</option>
            <option value="Shopping">Shopping</option>
            <option value="Specialty">Specialty</option>
            <option value="Unsought">Unsought</option>
        </select>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-bold">Add Product</button>
    </form>

</div>
        </div>
    </div>

    <div class="row my-4 g-3 bg-white p-3 shadow-sm rounded mx-0">
    <div class="col-md-4">
        <input type="text" id="search-input" class="form-control" placeholder="Search by title..." oninput="handleFilters()">
    </div>
    <div class="col-md-4">
        <select id="sort-select" class="form-select" onchange="handleFilters()">
            <option value="">Sort by Price</option>
            <option value="low">Low to High</option>
            <option value="high">High to Low</option>
        </select>
    </div>
    <div class="col-md-4">
        <select id="filter-category" class="form-select" onchange="handleFilters()">
            <option value="all">All Categories</option>
            <option value="Convenience">Convenience</option>
            <option value="Shopping">Shopping</option>
            <option value="Specialty">Specialty</option>
            <option value="Unsought">Unsought</option>
        </select>
    </div>
</div>

<div id="product-list" class="row mt-5"></div>

</div>

    <script src="script.js"></script>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
